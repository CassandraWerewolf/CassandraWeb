<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shamir's Secret Sharing Algorithm</title>
    <link rel="stylesheet" type="text/css" href="/assets/css/styles.css" />
    <link rel="stylesheet" type="text/css" href="/assets/css/mycss.css" />
    <style>#sss_status { font-weight: bold; min-height: 1.2em; }</style>


</head>

<body>
    <div class="section" id="page">
        <!-- Defining the #page section with the section tag -->
        <div class="header">
            <!-- Defining the header section of the page with the appropriate tag -->
            <h1>Secret Sharing</h1>
            <h3>Shamir's Algorithm</h3>
            <p>Runs entirely in your browser. Secrets and shares are never sent to the server.</p>
        </div>
        <div class="section" id="articles">
            <!-- A new section with the articles -->

            <!-- Article 1 start -->
            <div class="article" id="article1">
                <div class="articleBody clear">
                    <fieldset>
                        <p>
                            <label for="num_shares">Number of Shares (2 to 50)</label>
                            <textarea id="num_shares" rows="1" cols="3"></textarea>
                        </p>
                        <p>
                            <label for="num_thresh">Shares Threshold (&lt;=Shares)</label>
                            <textarea id="num_thresh" rows="1" cols="3"></textarea>
                        </p>
                        <p>
                            <label for="ident">Identifier (optional, up to 20 characters, no spaces)</label>
                            <textarea id="ident" rows="1" cols="20"></textarea>
                        </p>
                        <p>
                            <label for="secret">Secret (up to 255 characters)</label>
                            <textarea id="secret" cols="125" rows="3"></textarea>
                        </p>
                        <p>
                            <label for="shares_list">Shares (one per line)</label>
                            <textarea id="shares_list" cols="125" rows="20"></textarea>
                        </p>
                        <button type="button" id="get_shares">Get Shares</button>
                        <button type="button" id="get_secret">Get Secret</button>
                        <button type="button" class="reset">Reset</button>
                    </fieldset>
                    <p id="sss_status" role="status"></p>
                </div>
            </div>
            <!-- Article 1 end -->
        </div>

        <div class="footer">
            <!-- Marking the footer section -->
        </div>
    </div> <!-- Closing the #page section -->

    <!-- JavaScript Includes -->

    <!-- The vendored library imports its random-number helper by package name; map it to the local file. -->
    <script type="importmap">
      { "imports": { "shamir-secret-sharing/csprng": "./vendor/shamir-secret-sharing-0.0.4/csprng.js" } }
    </script>
    <script type="module" src="shamir.js"></script>
</body>

</html>
