# Dependabot version updates (security updates are turned on separately in
# Settings -> Advanced Security; see docs/security/ci-security-setup.md, Part A).
#
# Weekly, at most 5 open PRs per ecosystem. Minor and patch bumps are grouped
# into one PR per ecosystem; major bumps arrive as their own PRs.
# Every Dependabot PR still goes through the normal review + VM test before merge.
#
# Some upgrades are projects, not weekly bumps, so Dependabot skips them (see `ignore`):
#  - PHP and MariaDB minor/major versions (e.g. PHP 8.5 -> 8.6): new releases with
#    behavior changes; patch releases (8.5.x, 12.3.x) still arrive, because those
#    carry the security fixes.
#  - Psalm major versions (6 -> 7): Psalm 7 reports ~10k extra issues on this code
#    and doesn't match our baseline (seen in PR #43).
# Plan those upgrades deliberately (e.g. during the quarterly review), then raise or
# remove the matching ignore rule in the same PR.
version: 2

updates:
  # Dev tools only (Psalm); the app itself has no Composer dependencies.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: vimeo/psalm
        update-types: ["version-update:semver-major"]

  # Base images in Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /php
      - /scripts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Images in docker-compose.yml and docker-compose.prod.yml (mariadb, certbot).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: mariadb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Actions in .github/workflows/; Dependabot keeps the SHA pins and version comments in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
