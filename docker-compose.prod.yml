# Production stack for Docker Swarm (deployed as stack "cassandraweb" through Portainer).
#
# Images are built ON the Vultr host (x86_64) from this repo, not pulled from Docker Hub:
#   docker build -f php/Dockerfile -t cassandraweb:<tag> .
# then set CASSY_IMAGE=cassandraweb:<tag> in the stack's environment variables.
#
# Secrets come from the stack's environment variables in Portainer (never commit them):
#   MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD, BGG_USERNAME, BGG_PASSWORD, BGG_API_TOKEN
#
# Swarm ignores `restart:` and `depends_on`; restarts are set with deploy.restart_policy.
# "version" is obsolete for Compose but kept for older `docker stack deploy` tooling.
version: '3.9'

x-app-env: &app-env
  MYSQL_HOST: db
  MYSQL_DATABASE: werewolf
  MYSQL_USER: dbuser
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  BGG_USERNAME: ${BGG_USERNAME}
  BGG_PASSWORD: ${BGG_PASSWORD}
  TZ: 'America/Chicago'

services:
  web:
    image: ${CASSY_IMAGE:?set CASSY_IMAGE to the locally built image tag}
    ports:
      - "80:80"
      - "443:443"
    environment:
      <<: *app-env
    volumes:
      - certs_data:/etc/letsencrypt:ro
      # Automod rulesets are edited through the site; keep them across redeploys.
      # On first use the volume is filled with the rulesets from the image.
      - automod_rulesets:/var/www/html/automod/rulesets
    deploy:
      restart_policy:
        condition: any
        delay: 10s

  scripts:
    image: ${CASSY_IMAGE:?set CASSY_IMAGE to the locally built image tag}
    environment:
      <<: *app-env
      BGG_API_TOKEN: ${BGG_API_TOKEN}
    # Same loop as the previous prod stack: physics and automod were commented out there.
    command:
      - /bin/bash
      - -c
      - |
        while :
        do
          /opt/werewolf/run_collect_posts.sh
        #  /usr/local/bin/php /var/www/html/process_physics.php > /dev/null 2>&1
        #  /opt/werewolf/run_automod.sh
          sleep 1m
        done
    deploy:
      restart_policy:
        condition: any
        delay: 10s

  db:
    image: mariadb:12.3.3-noble
    # Match the old MySQL 5.6 behavior the code expects: non-strict SQL mode
    # and long GROUP_CONCAT results.
    command:
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --group-concat-max-len=65535
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: werewolf
      MARIADB_USER: dbuser
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: 'America/Chicago'
    volumes:
      # New volume. The old MySQL 5.6 volume (cassandraweb_mysql-data) is left untouched for rollback.
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    # No ports: the database is only reachable from the other services in this stack.
    deploy:
      restart_policy:
        condition: any
        delay: 10s

  certbot:
    image: certbot/dns-cloudflare:v5.10.0
    volumes:
      - certs_data:/etc/letsencrypt
      - /root/.secrets/certbot/cloudflare.ini:/root/.secrets/cloudflare.ini:ro
    # Same as before: certificates are renewed by hand with `docker exec … certbot renew`.
    entrypoint: sh
    command: -c "sleep infinity"
    deploy:
      restart_policy:
        condition: any
        delay: 10s

volumes:
  certs_data:
  mariadb_data:
  automod_rulesets:
