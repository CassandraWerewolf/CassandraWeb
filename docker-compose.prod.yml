version: '3.9'
services:
  web:
    image: cassandraproject/web:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: werewolf
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BGG_USERNAME: ${BGG_USERNAME}
      BGG_PASSWORD: ${BGG_PASSWORD}
      TZ: 'America/Chicago'
    volumes:
      - certs_data:/etc/letsencrypt:ro
    depends_on:
      - mysql
  scripts:
    image: cassandraproject/scripts:latest
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: werewolf
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BGG_USERNAME: ${BGG_USERNAME}
      BGG_PASSWORD: ${BGG_PASSWORD}
      BGG_API_TOKEN: ${BGG_API_TOKEN}
      TZ: 'America/Chicago'
    command:
        - /bin/bash
        - -c
        - |
          while :
          do
            /opt/werewolf/run_collect_posts.sh
          #  /usr/local/bin/php /var/www/html/process_physics.php > /dev/null 2>&1
          #  /opt/werewolf/run_automod.sh
            sleep 1m
          done
  mysql:
    image: mysql:5.6
    command: --group-concat-max-len=65535
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: werewolf
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: 'America/Chicago'
  certbot:
    image: certbot/dns-cloudflare:latest
    volumes:
      - certs_data:/etc/letsencrypt
      - /root/.secrets/certbot/cloudflare.ini:/root/.secrets/cloudflare.ini:ro
    environment:
      DOMAINS: "cassandrawerewolf.com"
      EMAIL: "certbot@anon.rkamail.com"
    entrypoint: sh
    command: -c "sleep infinity"
    deploy:
      replicas: 1
volumes:
  mysql-data:
  certs_data:
